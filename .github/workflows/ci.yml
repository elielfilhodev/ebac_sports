name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` respeita o lockfile: build reprodutível e sem resolução
      # oportunista de versões (proteção básica de supply chain).
      - run: npm ci

      - name: Auditoria de dependências
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npx eslint "src/**/*.{ts,tsx}"

      - name: Testes
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
